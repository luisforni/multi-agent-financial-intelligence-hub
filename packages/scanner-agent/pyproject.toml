[project]
name = "scanner-agent"
version = "1.0.0"
description = "Lightweight technical signal scanner — monitors a watchlist and fires alerts without LLM overhead"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "numpy>=2.2",
    "httpx>=0.28",
    "tenacity>=9.0",
    "structlog>=24.4",
]

[tool.uv.sources]
shared = { path = "../shared" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanner_agent"]
