[project]
name = "shared"
version = "1.0.0"
description = "Shared models, events, and utilities for the Financial Intelligence Hub"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis[hiredis]>=5.2",
    "structlog>=24.4",
    "tenacity>=9.0",
    "litellm>=1.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
