[project]
name = "orchestrator"
version = "1.0.0"
description = "Multi-agent orchestrator and REST API for the Financial Intelligence Hub"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "market-data-agent",
    "sentiment-agent",
    "risk-agent",
    "chart-vision-agent",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "structlog>=24.4",
    "tenacity>=9.0",
    "yfinance>=0.2",
]

[tool.uv.sources]
shared = { path = "../shared" }
market-data-agent = { path = "../market-data-agent" }
sentiment-agent = { path = "../sentiment-agent" }
risk-agent = { path = "../risk-agent" }
chart-vision-agent = { path = "../chart-vision-agent" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
