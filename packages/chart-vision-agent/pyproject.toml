[project]
name = "chart-vision-agent"
version = "1.0.0"
description = "Chart pattern recognition agent — generates stock charts and analyzes them with a vision or text LLM"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "litellm>=1.60",
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "numpy>=2.2",
    "mplfinance>=0.12",
    "matplotlib>=3.9",
    "structlog>=24.4",
]

[tool.uv.sources]
shared = { path = "../shared" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chart_vision_agent"]
