[project]
name = "market-data-agent"
version = "1.0.0"
description = "Real-time financial data extraction agent powered by Claude"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "numpy>=2.2",
    "httpx>=0.28",
    "tenacity>=9.0",
    "structlog>=24.4",
]

[tool.uv.sources]
shared = { path = "../shared" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_data_agent"]
