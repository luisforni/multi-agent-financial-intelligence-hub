[project]
name = "sentiment-agent"
version = "1.0.0"
description = "Social media and news sentiment analysis agent powered by Claude"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "praw>=7.8",
    "httpx>=0.28",
    "tenacity>=9.0",
    "structlog>=24.4",
]

[tool.uv.sources]
shared = { path = "../shared" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment_agent"]
