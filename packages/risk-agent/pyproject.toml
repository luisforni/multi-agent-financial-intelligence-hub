[project]
name = "risk-agent"
version = "1.0.0"
description = "Quantitative risk analysis and investment recommendation agent powered by Claude"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "numpy>=2.2",
    "pandas>=2.2",
    "scipy>=1.15",
    "yfinance>=0.2.50",
    "tenacity>=9.0",
    "structlog>=24.4",
]

[tool.uv.sources]
shared = { path = "../shared" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_agent"]
